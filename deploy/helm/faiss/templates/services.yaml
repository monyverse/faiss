apiVersion: v1
kind: Service
metadata:
  name: {{ include "faiss.fullname" . }}-api
  labels:
    {{- include "faiss.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    # The ALB health-checks the pods directly (target-type ip).
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
spec:
  type: ClusterIP
  selector:
    {{- include "faiss.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "faiss.fullname" . }}-web
  labels:
    {{- include "faiss.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  type: ClusterIP
  selector:
    {{- include "faiss.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
