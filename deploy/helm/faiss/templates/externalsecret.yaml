{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $basic := eq .Values.config.opensearch.auth "basic" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "faiss.fullname" . }}-env
  labels:
    {{- include "faiss.labels" . | nindent 4 }}
  annotations:
    # Argo CD waits for this to become Ready before starting the workloads.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStore.kind }}
    name: {{ $es.secretStore.name }}
  target:
    name: {{ include "faiss.envSecretName" . }}
    creationPolicy: Owner
    template:
      data:
        FAISS_DATABASE_URL: {{ include "faiss.databaseUrlTemplate" . | quote }}
        FAISS_LITELLM_API_KEY: {{ "{{ .litellmApiKey }}" | quote }}
        {{- if $basic }}
        FAISS_OPENSEARCH_USERNAME: {{ "{{ .opensearchUsername }}" | quote }}
        FAISS_OPENSEARCH_PASSWORD: {{ "{{ .opensearchPassword }}" | quote }}
        {{- end }}
  data:
    - secretKey: dbUsername
      remoteRef:
        key: {{ required "externalSecrets.database.remoteKey is required" $es.database.remoteKey | quote }}
        property: {{ $es.database.usernameProperty }}
    - secretKey: dbPassword
      remoteRef:
        key: {{ $es.database.remoteKey | quote }}
        property: {{ $es.database.passwordProperty }}
    - secretKey: litellmApiKey
      remoteRef:
        key: {{ required "externalSecrets.litellm.remoteKey is required" $es.litellm.remoteKey | quote }}
        property: {{ $es.litellm.property }}
    {{- if $basic }}
    - secretKey: opensearchUsername
      remoteRef:
        key: {{ required "externalSecrets.opensearch.remoteKey is required when config.opensearch.auth is basic" $es.opensearch.remoteKey | quote }}
        property: {{ $es.opensearch.usernameProperty }}
    - secretKey: opensearchPassword
      remoteRef:
        key: {{ $es.opensearch.remoteKey | quote }}
        property: {{ $es.opensearch.passwordProperty }}
    {{- end }}
{{- end }}
