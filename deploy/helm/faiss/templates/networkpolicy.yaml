{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $fullname := include "faiss.fullname" . }}
{{- $backendTargets := list "database" "opensearch" "litellm" "temporal" "awsEndpoints" "otel" }}
{{- /* Everything in the namespace is denied unless a policy below allows it. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels:
    {{- include "faiss.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-dns
  labels:
    {{- include "faiss.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# api: reachable from the ALB and from web; talks to the database, OpenSearch,
# the LiteLLM gateway, Temporal, the OIDC issuer and AWS endpoints only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "faiss.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      {{- include "faiss.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range $np.ingressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "faiss.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
        {{- if .Values.serviceMonitor.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
  {{- include "faiss.egress" (dict "root" . "targets" (append $backendTargets "oidc") "podIdentity" true "extra" true) | nindent 2 }}
---
# worker: no inbound traffic except metrics scraping; same egress as the api
# minus the OIDC issuer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "faiss.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      {{- include "faiss.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.serviceMonitor.enabled }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.worker.metricsPort }}
  {{- end }}
  {{- include "faiss.egress" (dict "root" . "targets" $backendTargets "podIdentity" true "extra" true) | nindent 2 }}
---
# web: reachable from the ALB; talks to the api only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "faiss.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      {{- include "faiss.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- with $np.ingressCidrs }}
  ingress:
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 3000
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "faiss.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
{{- if .Values.migrate.enabled }}
---
# migrate: database only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-migrate
  labels:
    {{- include "faiss.componentLabels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      {{- include "faiss.selectorLabels" (dict "root" . "component" "migrate") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- include "faiss.egress" (dict "root" . "targets" (list "database") "podIdentity" false "extra" false) | nindent 2 }}
{{- end }}
{{- if .Values.ingest.enabled }}
---
# ingest: OpenSearch (index), the LiteLLM gateway (embeddings) and AWS endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-ingest
  labels:
    {{- include "faiss.componentLabels" (dict "root" . "component" "ingest") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      {{- include "faiss.selectorLabels" (dict "root" . "component" "ingest") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- include "faiss.egress" (dict "root" . "targets" (list "opensearch" "litellm" "awsEndpoints" "otel") "podIdentity" true "extra" true) | nindent 2 }}
{{- end }}
{{- end }}
