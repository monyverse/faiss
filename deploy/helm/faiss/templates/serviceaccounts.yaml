{{- /*
One ServiceAccount per workload so IAM roles stay separate. With EKS Pod Identity
the role is bound by a Pod Identity association on namespace + name (created by
Terraform, deploy/terraform/modules/workload-identity) and no annotation is
needed. The web pods have no AWS access. The migrate ServiceAccount is a hook
resource and lives in migrate-job.yaml.
*/ -}}
{{- range $component := list "api" "worker" "web" "ingest" }}
{{- $settings := index $.Values $component }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "faiss.fullname" $ }}-{{ $component }}
  labels:
    {{- include "faiss.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- with $settings.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
