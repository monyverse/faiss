{{- if .Values.ingress.enabled }}
{{- $fullname := include "faiss.fullname" . }}
{{- if not .Values.ingress.inboundCidrs }}
{{- fail "ingress.inboundCidrs is required (client networks allowed to reach the ALB)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "faiss.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # AWS Load Balancer Controller: one ALB, TLS terminated with the ACM
    # certificate, HTTPS listener only, targets are pod IPs.
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.certificateArn is required (ACM certificate for publicHost)" .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/ssl-policy: {{ .Values.ingress.sslPolicy }}
    alb.ingress.kubernetes.io/inbound-cidrs: {{ join "," .Values.ingress.inboundCidrs | quote }}
    {{- with .Values.ingress.loadBalancerAttributes }}
    alb.ingress.kubernetes.io/load-balancer-attributes: {{ join "," . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ required "publicHost is required" .Values.publicHost | quote }}
      http:
        paths:
          # The API serves under /api itself; no rewrite.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web
                port:
                  name: http
{{- end }}
