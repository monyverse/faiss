{{- if .Values.migrate.enabled }}
{{- /*
Schema migrations run before anything else is applied:
  Argo CD  PreSync hook            Helm  pre-install,pre-upgrade hook
A PreSync hook runs before the chart's regular ConfigMap, Secret and
ServiceAccount exist, so this Job is self-contained: it has its own
ServiceAccount and ExternalSecret (hooks that sort before the Job) and receives
the non-secret configuration inline. Its database credentials can differ from
the application's (externalSecrets.migrateDatabase), which lets the application
run as a role without DDL rights.
*/ -}}
{{- $ctx := dict "root" . "component" "migrate" }}
{{- $fullname := include "faiss.fullname" . }}
{{- $es := .Values.externalSecrets }}
{{- $remoteKey := default $es.database.remoteKey $es.migrateDatabase.remoteKey }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-migrate
  labels:
    {{- include "faiss.componentLabels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- with .Values.migrate.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- if $es.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-migrate-env
  labels:
    {{- include "faiss.componentLabels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStore.kind }}
    name: {{ $es.secretStore.name }}
  target:
    name: {{ include "faiss.migrateSecretName" . }}
    creationPolicy: Owner
    template:
      data:
        FAISS_DATABASE_URL: {{ include "faiss.databaseUrlTemplate" . | quote }}
  data:
    - secretKey: dbUsername
      remoteRef:
        key: {{ required "externalSecrets.database.remoteKey or externalSecrets.migrateDatabase.remoteKey is required" $remoteKey | quote }}
        property: {{ $es.migrateDatabase.usernameProperty }}
    - secretKey: dbPassword
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: {{ $es.migrateDatabase.passwordProperty }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-migrate
  labels:
    {{- include "faiss.componentLabels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "faiss.componentLabels" $ctx | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}-migrate
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "faiss.scheduling" $ctx | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "faiss.image" (dict "root" . "repository" .Values.image.backendRepository) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - faiss_platform.migrate
          env:
            {{- include "faiss.commonEnv" . | nindent 12 }}
            {{- range $name, $value := include "faiss.config" . | fromYaml }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: FAISS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "faiss.migrateSecretName" . }}
                  key: FAISS_DATABASE_URL
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "faiss.tmpVolume" . | nindent 8 }}
{{- end }}
