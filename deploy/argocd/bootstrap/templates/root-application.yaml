apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.rootApplication.name }}
  namespace: {{ .Release.Namespace }}
spec:
  project: {{ .Values.rootApplication.project }}
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: {{ .Values.appsPath | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    {{- if .Values.rootApplication.automated }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
