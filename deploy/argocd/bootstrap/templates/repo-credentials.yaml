{{- if .Values.repoCredentials.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: faiss-repo
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.repoCredentials.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.clusterSecretStore.name }}
  target:
    name: faiss-repo
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: {{ .Values.repoURL | quote }}
  dataFrom:
    - extract:
        key: {{ required "repoCredentials.remoteKey is required when repoCredentials.enabled is true" .Values.repoCredentials.remoteKey | quote }}
{{- end }}
