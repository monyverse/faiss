[project]
name = "faiss-platform"
version = "0.1.0"
description = "FAISS — M&A Intelligence Platform backend (FastAPI, goal agents, Deal Twin)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.12",
  "langgraph>=0.2.50",
  "temporalio>=1.8",
  "prometheus-client>=0.21",
  "pypdf>=5.1",
  "openpyxl>=3.1",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
# Needed only in AWS: SigV4-signed OpenSearch access and S3 document storage.
aws = ["boto3>=1.35", "opensearch-py>=2.7"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faiss_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
# E501: the formatter owns line width; long prose strings are left whole.
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
